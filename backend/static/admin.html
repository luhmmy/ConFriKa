<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ConFriKa Admin</title>
<style>
  :root{
    --ocean:#154C79; --ocean-deep:#0E3A5F; --green:#2D8A4E; --sunset:#E87722;
    --bg:#F3F5F8; --card:#FFFFFF; --fg:#17212B; --muted:#5C6B78; --line:#E6EAF0;
    --shadow:0 1px 3px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.06);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0C1620; --card:#13212E; --fg:#EAF1F6; --muted:#9BB0C0; --line:#233446;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  img{max-width:100%}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
  .brand img{width:34px;height:34px}
  .brand .c{color:var(--ocean)}.brand .f{color:var(--sunset)}.brand .k{color:var(--green)}

  /* login */
  #loginView{min-height:100vh;display:grid;place-items:center;padding:20px;
    background:radial-gradient(1000px 500px at 80% -10%,rgba(232,119,34,.10),transparent 60%),
      radial-gradient(800px 500px at 0% 110%,rgba(45,138,78,.10),transparent 55%),var(--bg)}
  .login{width:100%;max-width:380px;background:var(--card);padding:30px;border-radius:18px;box-shadow:var(--shadow)}
  .login .brand{font-size:1.5rem;justify-content:center;margin-bottom:6px}
  .login p{margin:0 0 20px;color:var(--muted);font-size:.92rem;text-align:center}
  label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px;
    background:var(--bg);color:var(--fg)}
  input:focus{outline:2px solid var(--ocean);outline-offset:0;border-color:transparent}
  .btn{background:var(--ocean);color:#fff;border:0;padding:13px;border-radius:11px;width:100%;
    font-weight:700;cursor:pointer;font-size:14px;margin-top:16px}
  .btn:hover{background:var(--ocean-deep)}
  .err{color:#dc2626;font-size:13px;min-height:18px;margin-top:8px;text-align:center}

  /* app shell */
  header{position:sticky;top:0;z-index:10;background:var(--ocean);color:#fff;
    display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:var(--shadow)}
  header .brand{color:#fff;font-size:1.15rem}
  header .brand .c,header .brand .f,header .brand .k{color:#fff}
  header .tag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    background:rgba(255,255,255,.16);padding:3px 9px;border-radius:20px}
  header .sp{flex:1}
  header .who{font-size:.9rem;opacity:.9}
  header button{background:rgba(255,255,255,.14);color:#fff;border:0;padding:8px 14px;
    border-radius:9px;cursor:pointer;font-weight:600}
  header button:hover{background:rgba(255,255,255,.24)}
  main{max-width:1160px;margin:0 auto;padding:22px 20px 60px}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .tile .n{font-size:1.9rem;font-weight:800;line-height:1.1}
  .tile .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
  .tile.a .n{color:var(--ocean)} .tile.b .n{color:var(--green)} .tile.c .n{color:var(--sunset)}
  .tile.d .n{color:#dc2626}

  .row{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.row{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .panel h2{margin:0 0 14px;font-size:1rem;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--sunset)}

  .cc{margin-bottom:12px} .cc .t{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:4px}
  .bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ocean),var(--green))}

  .search{display:flex;gap:8px;margin-bottom:12px}
  .search input{padding:10px 12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:2px solid var(--line);font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
  td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .u{display:flex;align-items:center;gap:10px}
  .av{width:34px;height:34px;border-radius:50%;background:var(--ocean);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .u .em{color:var(--muted);font-size:.78rem}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.ban{background:#fde8e8;color:#b91c1c}.pill.ok{background:#e4f6ea;color:#166534}.pill.adm{background:#e2ecfa;color:#1e40af}
  @media (prefers-color-scheme:dark){.pill.ban{background:#3a1a1a}.pill.ok{background:#17311f}.pill.adm{background:#16263f}}
  .act{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12px}
  .act.ban{background:#fde8e8;color:#b91c1c}.act.unban{background:#e4f6ea;color:#166534}
  .act:hover{filter:brightness(.96)}
  .muted{color:var(--muted)} .hide{display:none!important}
</style>
</head>
<body>
<div id="loginView">
  <div class="login">
    <div class="brand"><img id="logo1" alt=""><span><span class="c">Con</span><span class="f">Fri</span><span class="k">Ka</span></span></div>
    <p>Administrator sign in</p>
    <label for="email">Email or @username</label>
    <input id="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="err" id="loginErr"></div>
    <button class="btn" onclick="login()">Sign in</button>
  </div>
</div>

<div id="appView" class="hide">
  <header>
    <div class="brand"><img id="logo2" alt=""><span><span class="c">Con</span><span class="f">Fri</span><span class="k">Ka</span></span></div>
    <span class="tag">Admin</span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button onclick="logout()">Sign out</button>
  </header>
  <main>
    <div class="tiles" id="tiles"></div>
    <div class="row">
      <div class="panel">
        <h2><span class="dot"></span>Users by country</h2>
        <div id="countries"></div>
      </div>
      <div class="panel">
        <h2><span class="dot"></span>Users</h2>
        <div class="search">
          <input id="q" placeholder="Search by username, email or name" oninput="debouncedUsers()" />
        </div>
        <table><thead><tr><th>User</th><th>Country</th><th>Status</th><th></th></tr></thead>
        <tbody id="users"></tbody></table>
      </div>
    </div>
  </main>
</div>

const API = location.origin + '/api/v1';
const MEDIA = location.origin;
let token = localStorage.getItem('confrika_admin_token') || '';

async function api(path, opts={}){
  const r = await fetch(API+path, {...opts, headers:{'Content-Type':'application/json','Authorization':'Bearer '+token, ...(opts.headers||{})}});
  if(!r.ok){ const b=await r.json().catch(()=>({})); throw new Error(b.detail||('Error '+r.status)); }
  return r.json();
}
async function login(){
  const err=document.getElementById('loginErr'); err.textContent='';
  try{
    const data = await (await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email_or_username:email.value.trim(),password:password.value})})).json();
    if(!data.access_token) throw new Error(data.detail||'Login failed');
    token = data.access_token;
    const me = await (await fetch(API+'/admin/me',{headers:{'Authorization':'Bearer '+token}})).json();
    if(!me.is_admin) throw new Error('This account is not an administrator.');
    localStorage.setItem('confrika_admin_token', token);
    showApp(me);
  }catch(e){ err.textContent = e.message; }
}
function logout(){ localStorage.removeItem('confrika_admin_token'); token=''; location.reload(); }
function showApp(me){
  document.getElementById('loginView').classList.add('hide');
  document.getElementById('appView').classList.remove('hide');
  document.getElementById('who').textContent = me.full_name || me.username;
  loadStats(); loadUsers();
}
function initials(n){return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join().toUpperCase();}
async function loadStats(){
  const s = await api('/admin/stats');
  const tiles=[['total_users','Total users','a'],['verified_users','Verified','b'],['banned_users','Banned','d'],
    ['total_countries','Countries','a'],['total_communities','Communities','c'],['direct_messages','Direct msgs','a'],['global_messages','Global msgs','b']];
  document.getElementById('tiles').innerHTML = tiles.map(([k,l,c])=>`<div class="tile ${c}"><div class="n">${s[k]??0}</div><div class="l">${l}</div></div>`).join('');
  const max = Math.max(1, ...s.users_by_country.map(c=>c.count));
  document.getElementById('countries').innerHTML = s.users_by_country.map(c=>
    `<div class="cc"><div class="t"><span>${c.country||'—'}</span><b>${c.count}</b></div><div class="bar"><i style="width:${c.count/max*100}%"></i></div></div>`
  ).join('') || '<p class="muted">No data yet</p>';
}
async function loadUsers(){
  const q = document.getElementById('q').value.trim();
  const list = await api('/admin/users'+(q?('?q='+encodeURIComponent(q)):''));
  document.getElementById('users').innerHTML = list.map(u=>{
    const av = u.avatar_url ? `<img src="${MEDIA+u.avatar_url}" alt="">` : initials(u.full_name);
    const status = u.is_admin?'<span class="pill adm">Admin</span>':(u.is_banned?'<span class="pill ban">Banned</span>':'<span class="pill ok">Active</span>');
    const btn = u.is_admin?'':(u.is_banned
      ?`<button class="act unban" onclick="setBan('${u.username}',false)">Unban</button>`
      :`<button class="act ban" onclick="setBan('${u.username}',true)">Ban</button>`);
    return `<tr><td><div class="u"><div class="av">${av}</div><div><b>${u.username}</b><div class="em">${u.email}</div></div></div></td><td>${u.country_code||''}</td><td>${status}</td><td style="text-align:right">${btn}</td></tr>`;
  }).join('') || '<tr><td colspan="4" class="muted">No users found</td></tr>';
}
let _t; function debouncedUsers(){ clearTimeout(_t); _t=setTimeout(loadUsers, 300); }
async function setBan(username, banned){
  if(!confirm((banned?'Ban ':'Unban ')+username+'?')) return;
  try{ await api(`/admin/users/${encodeURIComponent(username)}/${banned?'ban':'unban'}`,{method:'POST'}); loadUsers(); loadStats(); }
  catch(e){ alert(e.message); }
}
