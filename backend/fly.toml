# Fly.io config for the ConFriKa backend (FastAPI + self-hosted NLLB-200).
# Deploy from this directory:  cd backend && fly deploy
# The build context is this folder, matching backend/Dockerfile's COPY paths.

app = "confrika-backend"
primary_region = "jnb"   # Johannesburg — closest Fly region to most of Africa

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  TRANSLATION_PROVIDER = "nllb"
  # NLLB loads from a persistent volume (uploaded once, see FLY_DEPLOY.md).
  NLLB_MODEL = "/opt/confrika/nllb-local"
  MODEL_CACHE_DIR = "/opt/confrika/models"
  HF_HOME = "/opt/confrika/models"
  TRANSLATION_WARMUP = "true"
  # Monetization defaults (override with `fly secrets set` / this block).
  ADS_ENABLED = "true"
  PLAY_PACKAGE_NAME = "com.confrika.confrika_mobile"
  PRO_PRODUCT_IDS = "confrika_pro_monthly,confrika_pro_yearly"

# Persistent volume for the ~2.4GB translation model + HF cache.
[mounts]
  source = "confrika_models"
  destination = "/opt/confrika"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep the model warm; do not scale to zero
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"   # model warmup can take a little while on boot
  method = "GET"
  path = "/health"

# The NLLB model + CPU torch need real memory. 4GB is a safe floor.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
