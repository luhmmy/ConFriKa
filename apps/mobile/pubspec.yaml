name: confrika_mobile
description: ConFriKa — Cross-platform iOS & Android African language learning, translation, and communication app with self-learning tonal adaptation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  audioplayers: ^6.0.0
  record: ^5.1.2
  flutter_webrtc: ^0.11.7
  path_provider: ^2.1.3
  uuid: ^4.4.0
  flutter_callkit_incoming: ^2.0.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/confrika_logo_full.png
    - assets/images/confrika_app_icon.png
