# Reference coturn config (the compose file passes these as flags instead,
# injecting TURN_SECRET from deploy/.env). Use this file if you run coturn
# standalone: coturn -c /etc/turnserver.conf
listening-port=3478
listening-ip=0.0.0.0
realm=confrika

# Time-limited REST credentials (coturn shared-secret mechanism). The backend
# derives per-session username/credential from the same secret.
use-auth-secret
# static-auth-secret=REPLACE_WITH_TURN_SECRET

min-port=49152
max-port=49200

fingerprint
no-cli
no-tcp-relay
stale-nonce=600
no-stdout-log
log-file=/var/log/turnserver.log
