# ConFriKa production-grade stack. Secrets come from deploy/.env (git-ignored).
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: confrika_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: confrika_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: confrika_prod
    volumes:
      # Postgres 18+ official image stores data in a version-specific subdir and
      # expects the mount at /var/lib/postgresql (not .../data). Fresh volume for
      # the major upgrade; the old empty `postgres_data` volume is removable later.
      - postgres_data_v18:/var/lib/postgresql
    # Not published to the host: only reachable on the internal compose network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confrika_admin -d confrika_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    container_name: confrika_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: confrika_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      DATABASE_URL: postgresql+asyncpg://confrika_admin:${POSTGRES_PASSWORD}@postgres:5432/confrika_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.confrika.com}
      # Transactional email (OTP + password reset) via provider HTTP API.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ConFriKa <onboarding@resend.dev>}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      # Push notifications (Firebase Cloud Messaging)
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-/run/secrets/firebase-service-account.json}
      # Live in-call speech-to-speech translation
      VOICE_PROVIDER: ${VOICE_PROVIDER:-elevenlabs}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      TRANSLATION_PROVIDER: nllb
      # Load the model from a locally-provided directory (bind-mounted below).
      # Falls back to the HF id if the directory is empty.
      NLLB_MODEL: ${NLLB_MODEL:-/opt/confrika/nllb-local}
      MODEL_CACHE_DIR: /opt/confrika/models
      HF_HOME: /opt/confrika/models
      # Optional managed fallback for languages NLLB-200 lacks (e.g. Tiv).
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      TURN_HOST: ${TURN_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - model_cache:/opt/confrika/models
      - media_store:/opt/confrika/media
      - ${NLLB_LOCAL_DIR:-/home/roothawk/confrika_nllb}:/opt/confrika/nllb-local:ro
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8088:8000"

  nginx:
    image: nginx:1.31.8-alpine
    container_name: confrika_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  coturn:
    image: coturn/coturn:4.18.0-alpine
    container_name: confrika_coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--listening-port=3478"
      - "--listening-ip=0.0.0.0"
      - "--realm=confrika"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET in deploy/.env}"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--no-cli"
      - "--no-tcp-relay"
      - "--fingerprint"

volumes:
  postgres_data_v18:
  redis_data:
  model_cache:
  media_store:
